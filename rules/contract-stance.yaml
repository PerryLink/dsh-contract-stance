# 合同条款立场台账核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库的诚实说明：**excerpt 一律不是引文。**
#   本插件核对的是"合同条款立场台账"的**齐备与自洽**：条款是否摘录、本方立场是否明确、
#   风险等级是否在册、必保条款是否有退让底线、条款号是否唯一、是否残留模板占位符。
#   合同条款的实体法依据是《中华人民共和国民法典》合同编（**已逐字核对**，见
#   rules/evidence/clause-verification.md：第四百六十五条、第四百七十条、第五百零九条、
#   第五百七十七条、第五百八十四条）；
#   ⚠️ **但合同编规范的是合同的订立、效力、履行与违约责任，并不规范谈判台账的形式** ——
#   台账栏位要求出自各企业的合同管理办法。**不要把"台账没写退让底线"读成"违反民法典"。**
#   ⚠️ 另注意：民法典**确有**具体天数（第一百八十八条诉讼时效三年／二十年）与期间顺延（第二百零三条），
#   但**本插件不核对任何诉讼时效** —— 时效起算点是"知道或者应当知道权利受到损害以及义务人之日"，
#   属**事实认定**，台账里没有这个日期；且时效另有中止、中断与不适用时效的请求权。
#   **请勿给本插件添加"距签订超过三年则提示时效风险"之类的规则**，那会把事实认定包装成日期算术。
#   **本企业合同管理办法本次未取得逐字条文**，故每条 excerpt 如实写明，kind 降为 derived-from-principle（封顶 warn）。
#
# ⚠️⚠️ 另一条**必须保留**的边界：**本插件绝不判定条款是否应当接受、
#   风险是否可承受、是否应当签署合同、谈判策略是否得当**。
#   那取决于交易背景、对方的谈判地位与本企业的风险偏好，是业务与法务的判断。
#   → **立场清单（stances）与风险等级清单（riskLevels）都出厂为空**，
#     未配置即进 skipped，绝不静默通过。

plugin: dsh-contract-stance
version: "2026.1"

rules:
  - id: CS-001
    title: 每条条款都应摘录原文
    severity: warn
    basis:
      document: 《中华人民共和国民法典》
      number: 现行版本与条号本次未核实
      clause: 第四百七十条（合同的内容由当事人约定，一般包括……八项条款）
      excerpt: 合同的内容由当事人约定，一般包括下列条款：（一）当事人的姓名或者名称和住所；（二）标的；（三）数量；（四）质量；（五）价款或者报酬；（六）履行期限、地点和方式；（七）违约责任；（八）解决争议的方法。
      kind: derived-from-principle
      source: http://qthzy.hljcourt.gov.cn/public/detail.php?id=2907
    params:
        check:
          kind: presence
          field: text
          fix: 补填条款原文；本条只核对是否摘录，不判断条款是否可接受
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定，见 rules/evidence/clause-verification-civilcode-contract-book.md）：
      **第四百七十条说的是合同"一般包括"哪八项条款**，**并未要求任何台账必须有"条款原文"栏** ——
      该栏的必要性来自**本插件核对立场的前提**（没有原文就无法核对立场针对什么措辞），不是条文规定。
      ⇒ 保留 `derived-from-principle`；`excerpt` 已换为**第四百七十条第一款的逐字引文**。
      立场台账若只有主题而没有原文，就无法核对立场是针对什么措辞作出的。
      本次未取得明文条号，这是可核对性的**前提条件**，故封顶 warn。
      本条只核对原文栏是否填写，**不判断该条款是否应当接受、是否存在法律风险**。

  - id: CS-002
    title: 本方立场应使用本机构口径的取值
    severity: info
    basis:
      document: 《中华人民共和国民法典》
      number: 现行版本与条号本次未核实
      clause: 第四百六十九条（书面、口头或其他形式）、第四百九十条（签名、盖章或按指印时成立）
      excerpt: 当事人订立合同，可以采用书面形式、口头形式或者其他形式。……当事人采用合同书形式订立合同的，自当事人均签名、盖章或者按指印时合同成立。
      kind: derived-from-principle
      source: http://qthzy.hljcourt.gov.cn/public/detail.php?id=2907
    params:
        check:
          kind: enum
          field: stance
          values: []
    note: >-
      values 出厂为空，表示**未配置**，本条进 skipped。
      依据说明：立场的口径（例如「坚持」「可谈」「接受」「须删除」）随本机构谈判管理办法变化，
      本插件**不硬编码任何取值清单**。
      本条只核对所填值是否在册，**不判断该立场是否恰当**——那是业务与法务的判断。

  - id: CS-003
    title: 风险等级应使用本机构口径的取值
    severity: info
    basis:
      document: 《中华人民共和国民法典》
      number: 现行版本与条号本次未核实
      clause: 第五百零六条（免责条款无效的两种情形）、第四百九十七条（格式条款无效的三种情形）
      excerpt: 合同中的下列免责条款无效：（一）造成对方人身损害的；（二）因故意或者重大过失造成对方财产损失的。……有下列情形之一的，该格式条款无效：……（二）提供格式条款一方不合理地免除或者减轻其责任、加重对方责任、限制对方主要权利；（三）提供格式条款一方排除对方主要权利。
      kind: direct
      source: http://qthzy.hljcourt.gov.cn/public/detail.php?id=2907
    params:
        check:
          kind: enum
          field: riskLevel
          values: []
    note: >-
      ✅ **`kind` 已升为 `direct`**（2026-10-07 判定）：所引两条**规定的都是法律后果**——
      **第五百零六条**逐字「合同中的下列免责条款**无效**」，**第四百九十七条**逐字「该格式条款**无效**」并列出三项情形。
      ⇒ 风险等级栏所要标识的，正是这两条所指向的**无效风险**，故升为 `direct`。
      ⚠️ `values` 仍出厂为空：**分档（高／中／低）是本机构口径**，本插件不硬编码。
      values 出厂为空，表示**未配置**，本条进 skipped。
      依据说明：风险等级的分档（高／中／低，或 A／B／C）随本机构合同风险管理制度变化，
      本插件**不硬编码任何分档**。本条只核对所填值是否在册，
      **不判断该条款的实际风险有多高**——那需要结合交易背景判断。

  - id: CS-004
    title: 必保条款应写明退让底线
    severity: warn
    basis:
      document: 《中华人民共和国民法典》
      number: 现行版本与条号本次未核实
      clause: 第四百九十六条（格式条款的提示与说明义务）、第五百条（缔约过失）
      excerpt: 采用格式条款订立合同的，提供格式条款的一方应当遵循公平原则确定当事人之间的权利和义务，并采取合理的方式提示对方注意免除或者减轻其责任等与对方有重大利害关系的条款，按照对方的要求，对该条款予以说明。提供格式条款的一方未履行提示或者说明义务，致使对方没有注意或者理解与其有重大利害关系的条款的，对方可以主张该条款不成为合同的内容。
      kind: direct
      source: http://qthzy.hljcourt.gov.cn/public/detail.php?id=2907
    params:
        check:
          kind: conditionalPresence
          conditionField: mustHave
          requiredFields: ["fallback","owner"]
          conditionValues: ["是","Y","yes","true","必保","√"]
    note: >-
      ✅ **`kind` 已升为 `direct`**（2026-10-07 判定）：**第四百九十六条第二款为格式条款提供方设定了
      「采取合理的方式提示」与「按照对方的要求予以说明」两项义务**，并规定未履行的后果是
      「**对方可以主张该条款不成为合同的内容**」—— **"退让底线"正是这一义务在谈判台账上的落点**（让到哪里仍要提示与说明）。
      ⇒ `excerpt` 换为**逐字引文**，`kind` 升为 `direct`。
      必保条款是**一旦让步即影响本方核心利益**的条款；只标"必保"而不写退让底线与责任人，
      谈判现场就无法判断可以让到哪里、由谁决策。本次未取得明文条号，故封顶 warn。
      ⚠️ **哪些条款属于必保条款完全取决于本项目**，因此本条读取的是台账自己的「是否必保」栏，
      判定取值由 conditionValues 配置。
      本条只核对底线与责任人是否填写，**不判断该底线是否合理**。

  - id: CS-005
    title: 条款号不应在台账内重复
    severity: warn
    basis:
      document: 《中华人民共和国民法典》
      number: 现行版本与条号本次未核实
      clause: 第四百七十条（合同内容一般包括的八项条款）
      excerpt: 合同的内容由当事人约定，一般包括下列条款：（一）当事人的姓名或者名称和住所；……（八）解决争议的方法。
      kind: derived-from-principle
      source: http://qthzy.hljcourt.gov.cn/public/detail.php?id=2907
    params:
        check:
          kind: unique
          field: clauseNo
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **没有任何条文规定"条款号在台账内不得重复"** —— 唯一性只是**台账可指认性的需要**。
      ⇒ 保留 `derived-from-principle`；`excerpt` 已换为**第四百七十条的逐字引文**。
      条款号唯一是"每条条款只被登记一次"的**前提条件**：条款号重复会让人无法准确指认哪一条。
      本次未取得明文条号，故封顶 warn。比较时忽略空白字符。
      注意：同一条款在多个谈判稿版本中各有一行是正常的，此时应在版本栏区分，而不是重复使用条款号。

  - id: CS-006
    title: 台账应声明合同与本方主体
    severity: warn
    basis:
      document: 《中华人民共和国民法典》
      number: 现行版本与条号本次未核实
      clause: 第四百六十五条（合同仅对当事人具有法律约束力）、第四百七十条（一）（当事人的姓名或者名称和住所）
      excerpt: 依法成立的合同，受法律保护。依法成立的合同，仅对当事人具有法律约束力，但是法律另有规定的除外。……合同的内容由当事人约定，一般包括下列条款：（一）当事人的姓名或者名称和住所。
      kind: direct
      source: http://qthzy.hljcourt.gov.cn/public/detail.php?id=2907
    params:
        check:
          kind: headerPresence
          fields: ["contractName","party"]
    note: >-
      ✅ **`kind` 已升为 `direct`**（2026-10-07 判定）：**第四百六十五条第二款逐字规定**
      「依法成立的合同，**仅对当事人具有法律约束力**」—— **合同相对性是条文的直接规定**，
      台账不写明"合同"与"本方主体"即无法确定**谁是当事人**；第四百七十条第（一）项并把
      「当事人的姓名或者名称和住所」列为合同内容。
      ⇒ `excerpt` 换为**逐字引文**，`kind` 升为 `direct`。
      台账若不写明合同名称与本方主体，立场无法追溯到具体的交易与主体。
      本次未取得明文条号，故封顶 warn。
      配置项 contractName 对应材料顶层的合同名称，party 对应本方名称。
      若本机构表式另有版本栏（谈判稿版本），把它加进 fields 即可——**多轮谈判中版本区分很重要**。

  - id: CS-007
    title: 条款原文不应残留未替换的占位符
    severity: warn
    basis:
      document: 《中华人民共和国民法典》
      number: 现行版本与条号本次未核实
      clause: 第四百七十条（合同的内容由当事人约定）
      excerpt: 合同的内容由当事人约定，一般包括下列条款：（一）当事人的姓名或者名称和住所；……（八）解决争议的方法。当事人可以参照各类合同的示范文本订立合同。
      kind: derived-from-principle
      source: http://qthzy.hljcourt.gov.cn/public/detail.php?id=2907
    params:
        check:
          kind: containsAny
          field: text
          terms: ["【","】","{{","}}","XXX","xxx","待填","待补充","TBD","todo","示例"]
          fix: 条款原文应从合同稿抄录实际措辞；残留占位符说明台账是照模板抄的
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **第四百七十条既未禁止占位符、也未要求台账填写任何栏位** ——
      本条核对的是**台账是否照抄模板**，其必要性来自审阅的可信度，不是条文规定。
      ⇒ 保留 `derived-from-principle`；`excerpt` 已换为**逐字引文**（含第二款"示范文本"一句，
      正说明**参照示范文本是允许的，但不应把模板占位符当成已审阅的内容**）。
      台账若直接照抄模板，原文栏留下【】、XXX、待填、TBD 之类占位符时，
      会让人误以为已经审阅了实际条款——**这是审阅类台账最危险的失效方式**。
      本次未取得明文条号，故封顶 warn。terms 可按本机构模板调整。

disabled: []
